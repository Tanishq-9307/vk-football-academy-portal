<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VK Football Academy — Building Better Players. Building Better People. Youth football academy at Rustomjee Urbania, Majiwada, Thane West."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>VK Football Academy — Thane | Develop. Compete. Excel.</title>
    <!-- First paint must never be blank white: the React bundle and the
         preloader take a moment to load, so the page ground is charcoal
         from the first byte, and a static boot shell sits inside #root
         until React mounts and replaces it. -->
    <style>
      html,
      body {
        background: #0a0a0c;
      }
      .boot-shell {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #0a0a0c;
        color: #f4f4f5;
        font-family: "Oswald", "Arial Narrow", sans-serif;
        padding: 24px;
        text-align: center;
      }
      .boot-shell .boot-name {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #d4af37;
      }
      .boot-shell .boot-bar {
        width: 160px;
        height: 2px;
        background: #2b2b33;
        overflow: hidden;
        border-radius: 2px;
      }
      .boot-shell .boot-bar i {
        display: block;
        height: 100%;
        width: 40%;
        background: #c9a227;
        animation: boot-slide 1.2s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(400%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" aria-hidden="true">
        <svg width="84" height="94" viewBox="0 0 64 72" fill="none">
          <path
            d="M32 2 L58 10 V36 C58 54 46 64 32 70 C18 64 6 54 6 36 V10 Z"
            fill="#0a0a0c"
            stroke="#c9a227"
            stroke-width="2.5"
          />
          <text
            x="32"
            y="33"
            text-anchor="middle"
            font-family="Oswald, Arial Narrow, sans-serif"
            font-size="19"
            font-weight="700"
            fill="#f4f4f5"
          >
            VK
          </text>
          <rect x="14" y="44" width="36" height="7" rx="1" fill="#e30613" />
        </svg>
        <p class="boot-name">VK Football Academy</p>
        <div class="boot-bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
